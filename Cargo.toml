[package]
name = "cvlt"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Vault facade: the member side's trust core for identity, keys, credentials, proofs and storage"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-libs/cvlt.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE.md", "docs/**"]

[lib]
crate-type = ["rlib"]
# Original private retention codec vectors run in the unit harness.
test = true

[features]
default = []
wallet = ["dep:cwlt", "ckmg/passport", "ckmg/wallet-engine"]
wallet-native-prover = ["wallet", "cwlt/native-prover"]
native-records = ["ckmg/native-records", "dep:cmsh"]

[dependencies]
cwlt = { git = "https://git.corbet.ch/corbet-foss/cwlt", branch = "main", default-features = false, features = ["passport", "record", "account"], optional = true }
cchr = { git = "https://git.corbet.ch/corbet-foss/cchr.git", branch = "v01" }
ckyh = { git = "https://git.corbet.ch/corbet-foss/ckyh", branch = "main", default-features = false }
cprz = { git = "https://git.corbet.ch/corbet-foss/cprz.git", branch = "v01", default-features = false }
cprz-pad = { git = "https://git.corbet.ch/corbet-foss/cprz.git", branch = "v01" }
cdht = { git = "https://git.corbet.ch/corbet-foss/cdht.git", branch = "v01" }
cpky = { git = "https://git.corbet.ch/corbet-foss/cpky.git", branch = "v01" }
ckmg = { git = "https://git.corbet.ch/corbet-foss/ckmg.git", branch = "v01" }
cwst = { git = "https://git.corbet.ch/corbet-foss/cwst.git", branch = "v01" }
futures = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
blake3 = "1"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cmsh = { git = "https://git.corbet.ch/corbet-libs/cmsh.git", branch = "v01", features = ["veilid"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ckyh = { git = "https://git.corbet.ch/corbet-foss/ckyh", branch = "main", default-features = false, features = ["server"] }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt", branch = "main" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tempfile = "3"

[dev-dependencies]
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp", branch = "main" }
ed25519-dalek = { version = "3.0.0", features = ["digest"] }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }
cpky = { git = "https://git.corbet.ch/corbet-foss/cpky.git", branch = "v01", features = ["test-authenticator"] }
base64 = "0.22"
futures-executor = "0.3"
wasm-bindgen-test = "0.3.79"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { path = ".github/coverage-runtime" }
