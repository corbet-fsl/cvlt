[package]
name = "cvlt"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Vault facade: the member side's trust core for identity, keys, credentials, proofs and storage"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-fsl/cvlt.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "browser/**", "README.md", "LICENSE.md", "docs/**"]

[lib]
crate-type = ["rlib"]
# Original private retention codec vectors run in the unit harness.
test = true

[features]
default = []
wallet = ["dep:cwlt", "ckmg/passport", "ckmg/wallet-engine"]
wallet-native-prover = ["wallet", "cwlt/native-prover"]
wallet-browser-prover = ["wallet", "cwlt/browser-prover"]
native-records = ["ckmg/native-records", "dep:cmsh"]
# Native persistent unlock keeps its wrapping key in the OS key store (keyring crate).
os-keyring = ["dep:keyring"]

[dependencies]
cwlt = { git = "https://git.corbet.ch/corbet-foss/cwlt.git", branch = "main", default-features = false, features = ["passport", "record", "account"], optional = true }
cchr = { git = "https://git.corbet.ch/corbet-libre/cchr.git", branch = "main" }
cpsd = { git = "https://git.corbet.ch/corbet-libre/cpsd.git", branch = "main", default-features = false }
ckyh = { git = "https://git.corbet.ch/corbet-libre/ckyh.git", branch = "main", default-features = false }
cprz = { git = "https://git.corbet.ch/corbet-libre/cprz.git", branch = "main", default-features = false }
cprz-pad = { git = "https://git.corbet.ch/corbet-libre/cprz.git", branch = "main" }
cdht = { git = "https://git.corbet.ch/corbet-libre/cdht.git", branch = "main" }
cpky = { git = "https://git.corbet.ch/corbet-libre/cpky.git", branch = "main" }
ckmg = { git = "https://git.corbet.ch/corbet-libre/ckmg.git", branch = "main" }
cwst = { git = "https://git.corbet.ch/corbet-foss/cwst.git", branch = "main" }
futures = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
blake3 = "1"
sha2 = { version = "0.11", default-features = false }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cmsh = { git = "https://git.corbet.ch/corbet-fsl/cmsh.git", branch = "main", features = ["veilid"], optional = true }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.4"

# Windows Credential Manager is not enabled yet: the design requires local (not roaming or
# enterprise) persistence, unverified for keyring 3; Windows keeps the user-only file.

# Linux uses the pure-Rust Secret Service client (zbus, async-io): the `sync-secret-service` backend
# links libdbus-1 through `libdbus-sys` and needs the system headers at build time, which broke the
# slow suite (2026-10-23). `keyring`'s API stays synchronous (it blocks on zbus internally). The
# `async-io` runtime, not `tokio`: zbus's tokio mode blocks on one static current-thread runtime and
# panics when `keyring` is called from inside a tokio runtime, which cmsg does.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ckyh = { git = "https://git.corbet.ch/corbet-libre/ckyh.git", branch = "main", default-features = false, features = ["server"] }
crlt = { git = "https://git.corbet.ch/corbet-libre/crlt.git", branch = "main" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tempfile = "3"
# The native stamp tests drive cpsd's RNG-bound APIs; cpsd re-exports `ark_std::rand` (rand
# 0.8), whose `OsRng` is gated on the `getrandom` feature. Name the same major here so the
# tests do not depend on another dev-dependency (passkey-authenticator) enabling it.
rand = { version = "0.8", features = ["std_rng", "getrandom"] }

[dev-dependencies]
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp.git", branch = "main", features = ["reference"] }
ed25519-dalek = { version = "3.0.0", features = ["digest"] }
csgn = { git = "https://git.corbet.ch/corbet-libre/csgn.git", branch = "main", default-features = false, features = ["volatile-signer"] }
cpky = { git = "https://git.corbet.ch/corbet-libre/cpky.git", branch = "main", features = ["test-authenticator"] }
base64 = "0.22"
futures-executor = "0.3"
wasm-bindgen-test = "0.3.79"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { package = "browser-coverage-runtime-cvlt", path = ".github/coverage-runtime" }
